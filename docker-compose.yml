version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.web
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    depends_on:
      - server

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile.server
    ports:
      - '3001:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:password@db:5432/mydatabase
    depends_on:
      - db

  db:
    image: postgres:13
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydatabase
